# Publishes a prerelease from a pushed tag (vX.Y.Z or vX.Y.Z-test.N) on main. The tag must match
# About.xml <modVersion> and Petitions.csproj <Version>; the ZIP is built and tested from the tag.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the tag on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet build Source/Petitions.slnx -c Release
      - run: dotnet test --solution Source/Petitions.slnx -c Release --no-build
      - run: python3 -I tools/validate_mod_xml.py
      - run: python3 -I -m unittest discover -s tools -p 'test_*.py'
      - name: Package (checks the tag against the mod version)
        run: python3 -I tools/package_mod.py --version "$TAG" --output "dist/Petitions-$TAG.zip"
      - name: Publish prerelease
        run: |
          cat > notes.md <<'NOTES'
          **RimWorld 1.7専用のテスト版（プレリリース）です。ゲーム内での動作確認は未実施です。**

          `Petitions-*.zip` を展開し、中の `Petitions` フォルダを RimWorld の `Mods` フォルダに置いてください。
          GitHubが自動で付ける「Source code」はMOD本体ではありません。セーブはバックアップしてから試してください。
          NOTES
          gh release create "$TAG" "dist/Petitions-$TAG.zip" --verify-tag --prerelease --title "Petitions $TAG" --notes-file notes.md
