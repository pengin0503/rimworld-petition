# Publishes a prerelease from a pushed tag (vX.Y.Z or vX.Y.Z-test.N) on main, or from Actions > Release > Run workflow
# on main with that tag, which creates the tag on the checked commit only after every check passes. The tag must match
# About.xml <modVersion> and Petitions.csproj <Version>; the ZIP is built and tested from that commit.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create on the selected main commit, e.g. v0.1.0
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the tag on main
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag must look like v1.2.3 or v1.2.3-test.1: $TAG" >&2; exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists" >&2; exit 1
          fi
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet build Source/Petitions.slnx -c Release
      - run: dotnet test --solution Source/Petitions.slnx -c Release --no-build
      - run: python3 -I tools/validate_mod_xml.py
      - run: python3 -I -m unittest discover -s tools -p 'test_*.py'
      - name: Package (checks the tag against the mod version)
        run: python3 -I tools/package_mod.py --version "$TAG" --output "dist/Petitions-$TAG.zip"
      - name: Create the tag on this commit (dispatched runs)
        if: github.event_name == 'workflow_dispatch'
        run: gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
      - name: Publish prerelease
        run: |
          cat > notes.md <<'NOTES'
          **RimWorld 1.7専用のテスト版（プレリリース）です。ゲーム内での動作確認は未実施です。**

          `Petitions-*.zip` を展開し、中の `Petitions` フォルダを RimWorld の `Mods` フォルダに置いてください。
          GitHubが自動で付ける「Source code」はMOD本体ではありません。セーブはバックアップしてから試してください。
          NOTES
          gh release create "$TAG" "dist/Petitions-$TAG.zip" --verify-tag --prerelease --title "Petitions $TAG" --notes-file notes.md
